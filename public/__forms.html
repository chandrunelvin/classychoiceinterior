<!DOCTYPE html>
<!-- Netlify Forms reads this file at deploy time; the contact page posts its enquiry form here. -->
<html>
  <body>
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input name="name" />
      <input name="phone" />
      <input name="email" />
      <input name="service" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
